<script>
    (function() {
        const themeToggle = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        // Check for saved theme preference or default to system preference
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        function setTheme(theme) {
            if (theme === 'dark') {
                htmlElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else if (theme === 'light') {
                htmlElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            } else {
                htmlElement.removeAttribute('data-theme');
                localStorage.removeItem('theme');
            }
        }

        // Initialize theme
        if (savedTheme) {
            setTheme(savedTheme);
        }

        // Toggle theme on button click - simple toggle between light and dark
        if (themeToggle) {
            themeToggle.addEventListener('click', function() {
                const currentTheme = htmlElement.getAttribute('data-theme');

                // If currently has a manual theme set, toggle to the opposite
                if (currentTheme === 'dark') {
                    setTheme('light');
                } else if (currentTheme === 'light') {
                    setTheme('dark');
                } else {
                    // No manual theme set (using auto), set to opposite of system preference
                    setTheme(systemPrefersDark ? 'light' : 'dark');
                }
            });
        }

        // Listen for system theme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            if (!localStorage.getItem('theme')) {
                // Only update if user hasn't set a manual preference
                // No action needed - CSS media query will handle it
            }
        });
    })();
</script>
